      /* Fallback fonts matched via size-adjust — eliminates FOUT/FOIT flicker

    <script>
      /* Fallback de hidratação: se em 8s o React não marcar documentElement
         data-hydrated="1", mostramos um aviso discreto reforçando o WhatsApp
         (links já presentes no shell) e oferecendo recarregar. Não substitui
         o shell — apenas adiciona uma faixa com CTAs garantidos. */
      (function () {
        var DELAY = 8000;
        setTimeout(function () {
          if (document.documentElement.dataset.hydrated === "1") return;
          try {
            if (window.gtag) window.gtag('event', 'hydration_timeout', { non_interaction: true });
          } catch (e) {}
          var bar = document.createElement('div');
          bar.setAttribute('role', 'alert');
          bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#0b2733;color:#fff;padding:14px 44px 14px 16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;font:600 14px Montserrat,sans-serif;border-top:1px solid rgba(255,255,255,.18);transition:opacity .3s ease';
          bar.innerHTML = '<span>Conexão lenta? Fale com a gente:</span>' +
            '<a href="/contato" data-cta-location="hydration_timeout_bar" style="background:hsl(145,63%,42%);color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none">Falar com o técnico</a>' +
            '<a href="/diagnostico-60s" style="background:hsl(24,92%,52%);color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none">Diagnóstico 60s</a>' +
            '<button type="button" id="__hydra_reload" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);padding:10px 14px;border-radius:10px;cursor:pointer">Recarregar</button>' +
            '<button type="button" id="__hydra_close" aria-label="Fechar aviso" style="position:absolute;top:6px;right:10px;background:transparent;color:#fff;border:0;font:700 20px/1 Arial,sans-serif;padding:4px 8px;cursor:pointer;opacity:.8">&times;</button>';
          document.body.appendChild(bar);
          var hideTimer = null;
          var removeBar = function () {
            if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
            bar.style.opacity = '0';
            setTimeout(function () { if (bar.parentNode) bar.parentNode.removeChild(bar); }, 300);
          };
          var btn = document.getElementById('__hydra_reload');
          if (btn) btn.addEventListener('click', function () { location.reload(); });
          var closeBtn = document.getElementById('__hydra_close');
          if (closeBtn) closeBtn.addEventListener('click', removeBar);
          /* Some automaticamente após 15s. */
          hideTimer = setTimeout(removeBar, 15000);

        }, DELAY);
      })();
    </script>
