name = "tecnico-curitiba-edge"
main = "worker.js"
compatibility_date = "2026-01-01"

# Substitua a rota pelo padrão da zona antes do primeiro deploy:
#   npx wrangler deploy --config cloudflare/wrangler.toml
# Requer CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) e CLOUDFLARE_ACCOUNT_ID.
[[routes]]
pattern = "tecnico.curitiba.br/*"
zone_name = "curitiba.br"

[[routes]]
pattern = "www.tecnico.curitiba.br/*"
zone_name = "curitiba.br"

[build]
command = "npm run build"
cwd = ".."

[observability]
enabled = true
