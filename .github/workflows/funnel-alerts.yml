name: funnel-alerts

# Alerta diário quando triagem/WhatsApp/lead ficam abaixo do limite por
# rota, cidade, bairro ou serviço. Fail-closed: sem credenciais, não roda.
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - name: Avaliar limites do funil e alertar no Slack
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npm run alert:funnel
