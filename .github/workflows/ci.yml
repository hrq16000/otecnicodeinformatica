name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Lint (non-blocking warnings)
        run: npm run lint --silent || echo "::warning::lint reported issues"
      - name: Build
        run: npm run build
      - name: JSON-LD validation
        run: npm run validate:jsonld

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: npx vite preview --port 8080 &
        env:
          CI: "true"
      - name: Wait for server
        run: npx wait-on http://localhost:8080 --timeout 60000
      - name: Run targeted E2E (whatsapp + termos + sitemap)
        run: npx playwright test e2e/whatsapp-funnel.spec.ts e2e/termos-e-condicoes.spec.ts e2e/seo-sitemap-robots.spec.ts
        env:
          E2E_BASE_URL: http://localhost:8080

