# tecnico-curitiba-route-guard — Worker de borda (NÃO PUBLICAR AINDA)
#
# Pré-requisitos antes de qualquer `wrangler deploy`:
#   1. `tecnico.curitiba.br` adicionado MANUALMENTE como zona na Cloudflare
#      (curitiba.br é domínio de registro e não pode ser zona do projeto).
#   2. Origem real do Lovable configurada em LOVABLE_ORIGIN (CNAME fornecido
#      ao ativar o modo avançado de proxy). Enquanto o valor for
#      LOVABLE_ORIGIN_NOT_CONFIGURED o worker recusa servir a origem.
#   3. Token B (Workers Scripts: Edit + Workers Routes: Edit + Zone: Read),
#      distinto do Token A usado nos Bulk Redirects.
#
# Pré-voo somente leitura:
#   npm run cf:edge:dry
#   npm run check:cf-zone -- --enforce

name = "tecnico-curitiba-route-guard"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Modelo de origem (Rodada 2A.3, Fase 6):
#   "dns"      → fetch(request); a origem é o CNAME proxied da própria zona.
#                Preferido: não inventa hostname, preserva Host/cookies/método.
#   "explicit" → fetch(LOVABLE_ORIGIN); só com evidência de que o DNS não serve.
ORIGIN_MODE = "dns"
# Só é lido quando ORIGIN_MODE = "explicit".
LOVABLE_ORIGIN = "LOVABLE_ORIGIN_NOT_CONFIGURED"

[[routes]]
pattern = "tecnico.curitiba.br/*"
zone_name = "tecnico.curitiba.br"

# Habilitar somente quando o hostname www estiver realmente em uso.
# [[routes]]
# pattern = "www.tecnico.curitiba.br/*"
# zone_name = "tecnico.curitiba.br"

# Sem [build]: o bundle do site é gerado antes, por `npm run build` na raiz do
# repositório (gate obrigatório). Deixar o wrangler disparar o build tornava o
# dry-run dependente do diretório de execução.


[observability]
enabled = true
