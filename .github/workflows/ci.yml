name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Lint (non-blocking warnings)
        run: npm run lint --silent || echo "::warning::lint reported issues"
      - name: Build
        run: npm run build
      - name: JSON-LD validation
        run: npm run validate:jsonld
